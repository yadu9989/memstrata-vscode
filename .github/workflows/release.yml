name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    if: github.repository == 'yadu9989/memstrata-vscode'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require the exact package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run compile && npm test
      - run: npm run package -- --out "$RUNNER_TEMP/extension.vsix"
      - run: python test/audit_vsix.py "$RUNNER_TEMP/extension.vsix"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audited-vsix
          path: ${{ runner.temp }}/extension.vsix
          if-no-files-found: error

  publish:
    if: github.repository == 'yadu9989/memstrata-vscode'
    needs: package
    runs-on: ubuntu-24.04
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: audited-vsix
          path: ${{ runner.temp }}
      - run: python test/audit_vsix.py "$RUNNER_TEMP/extension.vsix"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install vsce publish --oidc --packagePath "$RUNNER_TEMP/extension.vsix"
      - name: Publish the same VSIX to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.3.0 publish "$RUNNER_TEMP/extension.vsix" -p "$OVSX_PAT"
